<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <!-- ============ META ============ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1C2541" />
  <!-- Client pages are private links: keep them out of search engines -->
  <meta name="robots" content="noindex, nofollow" />
  <title>nfcxz</title>
  <meta name="application-name" content="nfcxz" />
  <meta name="apple-mobile-web-app-title" content="nfcxz" />

  <!-- ============ FONTS (Poppins) ============ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ============ FONT AWESOME ============ -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- ============ TAILWIND CSS ============ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            navy: '#1C2541',     // page background
            steel: '#3A506B',    // cards, borders, glows
            charcoal: '#303841', // gradient bottom, toast
          },
        },
      },
    };
  </script>

  <!-- ============ CUSTOM STYLES ============ -->
  <style>
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    .tiktok-icon { text-shadow: -2px -2px 0 #25F4EE, 2px 2px 0 #FE2C55; }
    .bg-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-b from-navy to-charcoal bg-fixed font-sans text-slate-100 antialiased">

  <!-- Decorative background glows -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-32 left-1/2 h-80 w-80 -translate-x-1/2 rounded-full bg-steel/50 blur-3xl"></div>
    <div class="absolute bottom-0 -right-20 h-72 w-72 rounded-full bg-steel/30 blur-3xl"></div>
  </div>

  <!-- Loading state -->
  <div id="loading" class="flex min-h-screen items-center justify-center">
    <i class="fa-solid fa-circle-notch fa-spin text-3xl text-cyan-400" aria-hidden="true"></i>
    <span class="sr-only">Loading…</span>
  </div>

  <!-- Not-found state -->
  <div id="not-found" class="hidden min-h-screen flex-col items-center justify-center px-6 text-center">
    <i class="fa-solid fa-id-card text-5xl text-slate-400" aria-hidden="true"></i>
    <h1 class="mt-6 text-2xl font-bold text-white">Card not found</h1>
    <p class="mt-2 text-sm text-slate-300">This link is invalid or the card has been removed.</p>
  </div>

  <!-- Card (filled in by the script below from /clients/<key>.json) -->
  <main id="card" class="mx-auto hidden w-full max-w-md px-5 pb-10 pt-12">

    <!-- SECTION 1: HERO / PROFILE -->
    <section class="reveal text-center" aria-labelledby="profile-name">
      <div class="mx-auto w-full">
        <div class="overflow-hidden rounded-3xl shadow-lg shadow-black/30">
          <img id="photo" alt="" class="block h-auto w-full" fetchpriority="high"
               onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');" />
          <span id="initials" aria-hidden="true" class="hidden flex aspect-square w-full items-center justify-center bg-gradient-to-br from-steel to-navy text-6xl font-semibold text-cyan-300"></span>
        </div>
      </div>

      <h1 id="profile-name" class="mt-6 text-3xl font-bold tracking-tight text-white"></h1>
      <p id="profile-title" class="mt-1 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-sm font-medium text-transparent"></p>
      <p id="profile-bio" class="mt-4 text-sm leading-relaxed text-slate-300"></p>

      <button id="save-contact" type="button"
        class="mt-6 inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 px-6 py-3 text-sm font-semibold text-navy shadow-lg shadow-cyan-500/25 transition duration-200 hover:scale-105 hover:shadow-cyan-400/50 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300 focus-visible:ring-offset-2 focus-visible:ring-offset-navy">
        <i class="fa-solid fa-address-book" aria-hidden="true"></i>
        Save Contact
      </button>
    </section>

    <!-- SECTION 2: CONTACT INFO -->
    <section id="contact-info" class="reveal mt-10 space-y-3" aria-label="Contact information"></section>

    <!-- SECTION 3: QUICK ACTION BUTTONS -->
    <section id="actions-section" class="reveal mt-10" aria-labelledby="quick-actions">
      <h2 id="quick-actions" class="mb-4 text-center text-lg font-semibold text-white">Get in touch</h2>
      <div id="actions" class="space-y-3"></div>
    </section>

    <!-- SECTION 4: SOCIAL MEDIA LINKS -->
    <section id="socials-section" class="reveal mt-10" aria-labelledby="connect-heading">
      <h2 id="connect-heading" class="mb-4 text-center text-lg font-semibold text-white">Connect with me</h2>
      <div id="socials" class="space-y-3"></div>
    </section>

  </main>

  <!-- Floating back-to-top button -->
  <button id="back-to-top" type="button" aria-label="Back to top"
    class="pointer-events-none fixed bottom-5 right-5 flex h-12 w-12 translate-y-4 items-center justify-center rounded-full bg-gradient-to-br from-cyan-400 to-blue-500 text-navy opacity-0 shadow-lg shadow-cyan-500/30 transition duration-300 hover:scale-110 hover:shadow-cyan-400/60 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-300">
    <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
  </button>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"
       class="pointer-events-none fixed bottom-20 left-1/2 -translate-x-1/2 rounded-full border border-white/10 bg-charcoal/95 px-4 py-2 text-sm text-white opacity-0 shadow-lg backdrop-blur transition duration-300">
  </div>

  <!-- ============ SCRIPTS ============ -->
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);

      /* ---------- Escape text before putting it into HTML ---------- */
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
      // Only allow safe link schemes from the JSON
      const safeUrl = (u) => /^(https?:|mailto:|tel:|sms:)/i.test(String(u || '')) ? String(u) : '#';

      /* ---------- Social platform styles ---------- */
      const SOCIALS = {
        facebook:  { label: 'Facebook',  icon: 'fa-brands fa-facebook-f',  cls: '', style: 'background:#1877F2' },
        tiktok:    { label: 'TikTok',    icon: 'fa-brands fa-tiktok tiktok-icon', cls: 'border border-white/15', style: 'background:#000' },
        instagram: { label: 'Instagram', icon: 'fa-brands fa-instagram',   cls: 'bg-instagram', style: '' },
        linkedin:  { label: 'LinkedIn',  icon: 'fa-brands fa-linkedin-in', cls: '', style: 'background:#0A66C2' },
        github:    { label: 'GitHub',    icon: 'fa-brands fa-github',      cls: 'border border-white/15', style: 'background:#24292f' },
        youtube:   { label: 'YouTube',   icon: 'fa-brands fa-youtube',     cls: '', style: 'background:#FF0000' },
        x:         { label: 'X',         icon: 'fa-brands fa-x-twitter',   cls: 'border border-white/15', style: 'background:#000' },
        whatsapp:  { label: 'WhatsApp',  icon: 'fa-brands fa-whatsapp',    cls: '', style: 'background:#25D366' },
        telegram:  { label: 'Telegram',  icon: 'fa-brands fa-telegram',    cls: '', style: 'background:#229ED9' },
        messenger: { label: 'Messenger', icon: 'fa-brands fa-facebook-messenger', cls: '', style: 'background:#0084FF' },
        website:   { label: 'Website',   icon: 'fa-solid fa-globe',        cls: 'border border-white/10 bg-steel', style: '' },
      };

      const infoCard = (icon, color, label, value) => `
        <div class="flex items-center gap-4 rounded-2xl border border-white/10 bg-steel p-4 shadow-lg shadow-black/30">
          <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl ${color}">
            <i class="${icon}" aria-hidden="true"></i>
          </div>
          <div class="min-w-0 flex-1 text-left">
            <p class="text-xs uppercase tracking-wider text-slate-300">${esc(label)}</p>
            <p class="mt-0.5 break-words text-sm font-medium text-white [overflow-wrap:anywhere]">${esc(value)}</p>
          </div>
        </div>`;

      const actionBtn = (href, icon, title, sub, aria) => `
        <a href="${esc(safeUrl(href))}" aria-label="${esc(aria)}"
           class="group flex w-full items-center gap-4 rounded-2xl border border-white/10 bg-steel p-4 shadow-lg shadow-black/30 transition duration-200 hover:scale-[1.02] hover:border-cyan-400/50 hover:brightness-110 hover:shadow-cyan-500/20 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400">
          <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-cyan-400 to-blue-500 text-lg text-navy">
            <i class="${icon}" aria-hidden="true"></i>
          </span>
          <span class="flex-1">
            <span class="block font-semibold text-white">${esc(title)}</span>
            <span class="block text-xs text-slate-300">${esc(sub)}</span>
          </span>
          <i class="fa-solid fa-chevron-right text-slate-400 transition group-hover:translate-x-1 group-hover:text-cyan-400" aria-hidden="true"></i>
        </a>`;

      const socialBtn = (s, firstName) => {
        const p = SOCIALS[String(s.type || '').toLowerCase()] || SOCIALS.website;
        const label = s.label || p.label;
        return `
        <a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer"
           aria-label="Visit ${esc(firstName)}'s ${esc(label)} (opens in a new tab)"
           class="${p.cls} flex w-full items-center justify-center gap-3 rounded-2xl p-4 font-semibold text-white shadow-lg shadow-black/30 transition duration-200 hover:scale-[1.02] hover:brightness-110 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
           style="${p.style}">
          <i class="${p.icon} text-lg" aria-hidden="true"></i>
          ${esc(label)}
        </a>`;
      };

      /* ---------- Work out which client to load from the URL ---------- */
      const path = location.pathname.replace(/^\/+|\/+$/g, '');
      const key = path === '' || path === 'index' || path === 'index.html' ? 'home' : path;

      if (!/^[A-Za-z0-9_-]+$/.test(key)) return showNotFound();

      // Each client has its own folder: /clients/<key>/data.json + photo.jpg
      const folder = `/clients/${encodeURIComponent(key)}/`;
      fetch(`${folder}data.json`, { cache: 'no-cache' })
        .then((r) => { if (!r.ok) throw new Error('not found'); return r.json(); })
        .then(render)
        .catch(showNotFound);

      function showNotFound() {
        $('loading').classList.add('hidden');
        $('not-found').classList.remove('hidden');
        $('not-found').classList.add('flex');
      }

      function render(c) {
        const fullName = [c.firstName, c.middle, c.lastName].filter(Boolean).join(' ');
        const phoneDisplay = c.phoneDisplay || c.phone;

        const meta = document.createElement('meta');
        meta.name = 'description';
        meta.content = c.bio || fullName;
        document.head.appendChild(meta);

        // Hero
        // Photo defaults to photo.jpg in the client's folder
        const photo = c.photo === '' ? '' : (c.photo || 'photo.jpg');
        $('photo').src = /^(https?:)?\/|^data:/.test(photo) ? photo : folder + photo;
        $('photo').alt = c.photoAlt || fullName;
        if (!photo) $('photo').onerror();
        $('initials').textContent = ((c.firstName || '')[0] || '') + ((c.lastName || '')[0] || '');
        $('profile-name').textContent = fullName;
        $('profile-title').textContent = c.title || '';
        $('profile-bio').textContent = c.bio || '';
        if (!c.bio) $('profile-bio').classList.add('hidden');
        $('save-contact').setAttribute('aria-label', `Save ${fullName} to your contacts`);

        // Contact info cards
        let info = '';
        if (c.phone) info += infoCard('fa-solid fa-phone', 'bg-cyan-400/10 text-cyan-400', 'Phone', phoneDisplay);
        if (c.email) info += infoCard('fa-solid fa-envelope', 'bg-blue-500/10 text-blue-400', 'Email Address', c.email);
        $('contact-info').innerHTML = info;
        if (!info) $('contact-info').classList.add('hidden');

        // Quick actions
        let actions = '';
        if (c.phone) {
          actions += actionBtn(`tel:${c.phone}`, 'fa-solid fa-phone-volume', 'Call Me', phoneDisplay, `Call ${c.firstName} at ${phoneDisplay}`);
          actions += actionBtn(`sms:${c.phone}`, 'fa-solid fa-comment-sms', 'Text / SMS', 'Send me a message', `Send a text message to ${c.firstName}`);
        }
        if (c.email) {
          const subj = c.emailSubject ? `?subject=${encodeURIComponent(c.emailSubject)}` : '';
          actions += actionBtn(`mailto:${c.email}${subj}`, 'fa-solid fa-envelope-open-text', 'Send Email', c.emailSubject || c.email, `Send an email to ${c.firstName}`);
        }
        $('actions').innerHTML = actions;
        if (!actions) $('actions-section').classList.add('hidden');

        // Socials
        const socials = Array.isArray(c.socials) ? c.socials.filter((s) => s && s.url) : [];
        $('socials').innerHTML = socials.map((s) => socialBtn(s, c.firstName)).join('');
        if (!socials.length) $('socials-section').classList.add('hidden');


        // vCard download
        $('save-contact').addEventListener('click', () => {
          const lines = [
            'BEGIN:VCARD', 'VERSION:3.0',
            `N:${c.lastName || ''};${c.firstName || ''};${c.middle || ''};;`,
            `FN:${fullName}`,
          ];
          if (c.title) lines.push(`TITLE:${c.title}`);
          if (c.phone) lines.push(`TEL;TYPE=CELL,VOICE:${c.phone}`);
          if (c.email) lines.push(`EMAIL;TYPE=INTERNET:${c.email}`);
          lines.push(`URL:${location.origin}${location.pathname}`);
          lines.push('END:VCARD');

          const blob = new Blob([lines.join('\r\n')], { type: 'text/vcard;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${fullName.replace(/[^\w.-]+/g, '-')}.vcf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('Contact card downloaded — open it to save.');
        });

        $('loading').classList.add('hidden');
        $('card').classList.remove('hidden');
        startReveal();
      }

      /* ---------- Toast ---------- */
      const toast = $('toast');
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('opacity-0');
        clearTimeout(showToast.t);
        showToast.t = setTimeout(() => toast.classList.add('opacity-0'), 2500);
      }

      /* ---------- Scroll-reveal animations ---------- */
      function startReveal() {
        const els = document.querySelectorAll('.reveal');
        if (!('IntersectionObserver' in window)) return els.forEach((el) => el.classList.add('is-visible'));
        const obs = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add('is-visible'); obs.unobserve(e.target); }
          });
        }, { threshold: 0.12 });
        els.forEach((el) => obs.observe(el));
      }

      /* ---------- Back-to-top button ---------- */
      const topBtn = $('back-to-top');
      const toggleTopBtn = () => {
        const show = window.scrollY > 300;
        topBtn.classList.toggle('opacity-0', !show);
        topBtn.classList.toggle('translate-y-4', !show);
        topBtn.classList.toggle('pointer-events-none', !show);
      };
      window.addEventListener('scroll', toggleTopBtn, { passive: true });
      toggleTopBtn();
      topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    })();
  </script>
</body>
</html>
